<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — IA &amp; Big Data</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #02040a;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container { 
      width: 100%; 
      height: 100%; 
      position: absolute; 
      top: 0; 
      left: 0; 
    }

    /* EN-TÊTE */
    #app-header {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 16px 22px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      pointer-events: none;
    }
    #app-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }
    #app-header p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* PANNEAU D'INFORMATION DES PROJETS */
    #info-panel {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px);
      padding: 24px;
      border-radius: 20px;
      width: 420px;
      max-width: calc(100vw - 50px);
      max-height: 85vh;
      overflow-y: auto;
      display: none;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      z-index: 10;
      animation: panelSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #info-panel::-webkit-scrollbar {
      width: 6px;
    }
    #info-panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    #info-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    @keyframes panelSlideIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .info-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .info-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 8px;
    }

    #info-title { 
      font-size: 1.5rem; 
      font-weight: 800; 
      color: #ffffff; 
      line-height: 1.2;
    }

    #close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    #close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }

    .info-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .info-text-paragraph {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* BADGES TECHNO / SKILLS */
    .tech-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tech-badge {
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 8px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 12px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #38bdf8;
    }

    /* BARRE DE NAVIGATION */
    #nav-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      padding: 10px 18px;
      border-radius: 50px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.25s ease;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-btn:hover { 
      color: #ffffff; 
      background: rgba(255, 255, 255, 0.08); 
    }

    .nav-btn.active {
      color: #ffffff;
      font-weight: 600;
    }

    :root { --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
    body { background: radial-gradient(ellipse at 50% 40%, #0b1424 0%, #02040a 75%); }
    #app-header h1 { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
    #app-header p { font-size: 0.85rem; line-height: 1.45; max-width: 270px; }
    #app-header .hint { margin-top: 8px; font-size: 0.78rem; color: #7f8ea3; font-style: italic; }
    #info-title { font-family: var(--serif); font-weight: 600; font-size: 1.65rem; }
    .info-tag { text-transform: none; letter-spacing: 0.02em; font-size: 0.8rem; }
    .info-section-title { font-family: var(--serif); text-transform: none; letter-spacing: 0; font-size: 1.02rem; font-weight: 600; color: #eadfc8; }
    .metric-label { font-size: 0.8rem; }
    .info-list-item { align-items: flex-start; border-left: 3px solid var(--accent, #f4e3c1); }
    .tech-badge { border-radius: 20px; font-weight: 500; }
    #info-panel a { color: var(--accent, #f4e3c1); text-underline-offset: 3px; }
    .place-chip, .back-link { font: inherit; font-size: 0.88rem; color: #e2e8f0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); border-radius: 20px; padding: 7px 14px; cursor: pointer; margin: 0 6px 8px 0; transition: all 0.2s ease; }
    .place-chip:hover, .back-link:hover { border-color: var(--accent, #f4e3c1); background: rgba(255,255,255,0.1); }
    .back-link { margin-top: 18px; }
    #nav-bar { max-width: calc(100vw - 24px); overflow-x: auto; }
    .nav-btn { white-space: nowrap; }
    #tooltip { position: fixed; display: none; pointer-events: none; z-index: 20; background: rgba(15,23,42,0.92); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 10px; font-size: 0.85rem; }
    .ico { flex-shrink: 0; }
    .info-tag { display: inline-flex; align-items: center; gap: 6px; }
    /* Barre du bas : icône au-dessus, nom en dessous, cases de même taille */
    #nav-bar { gap: 6px; padding: 8px; width: min(520px, calc(100vw - 24px)); border-radius: 22px; overflow: visible; }
    .nav-btn { flex: 1 1 0; min-width: 0; height: 66px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; font-size: 0.74rem; line-height: 1.1; }
    .nav-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Message d'accueil : disparaît en douceur */
    #app-header { transition: opacity 1s ease, transform 1s ease; }
    #app-header.hide { opacity: 0; transform: translateY(-10px); }

    /* Responsive */
    @media (max-width: 640px) {
      #nav-bar { bottom: 14px; }
      .nav-btn { height: 60px; font-size: 0.66rem; }
      #info-panel { left: 12px; right: 12px; top: auto; bottom: 94px; width: auto; max-width: none; max-height: 48vh; }
      #app-header { top: 12px; left: 12px; padding: 12px 16px; }
    }
    #small-screen { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #02040a; color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; }
    @media (max-width: 319px), (max-height: 359px) { #small-screen { display: flex; } }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="app-header">
    <h1>Bienvenue dans ce monde</h1>
    <p>Étudiant en IA &amp; Big Data, en recherche de stage.</p>
    <p class="hint">Faire tourner le globe, puis choisir un territoire en bas de l'écran.</p>
  </div>

  <div id="info-panel">
    <div class="info-header-row">
      <div>
        <span id="info-tag" class="info-tag">PROJET</span>
        <h2 id="info-title">Titre du Projet</h2>
      </div>
      <button id="close-btn" aria-label="Fermer" onclick="closeInfo()">&times;</button>
    </div>
    <div id="info-body"></div>
  </div>

  <div id="nav-bar"></div>
  <div id="tooltip"></div>
  <div id="small-screen">Écran trop petit pour afficher ce portfolio.<br>Merci d'agrandir la fenêtre ou de tourner l'appareil.</div>

  <script>
    let VITESSE_ROTATION = 0.6;

    let scene, camera, renderer, controls;
    const sphereRadius = 5;
    const ZOOM_PAYS = 5.5;

    let countryMarkers = [];
    let countryObjects = [];
    let pulsingRings = [];
    let coreMesh = null;
    let animFrameId = null;
    let globalData = null;
    let globeGroup = null;
    let saturnRingMesh = null;

    function latLngToVector3(lat, lng, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lng + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = (radius * Math.sin(phi) * Math.sin(theta));
      const y = (radius * Math.cos(phi));
      return new THREE.Vector3(x, y, z);
    }

    function reactiverAutoRotation() {
      if (controls) {
        controls.autoRotate = true;
        controls.autoRotateSpeed = VITESSE_ROTATION;
      }
    }

    function stopperAutoRotation() {
      if (controls) {
        controls.autoRotate = false;
      }
    }

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 16);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      controls.autoRotate = true;
      controls.autoRotateSpeed = VITESSE_ROTATION;

      globeGroup = new THREE.Group();
      scene.add(globeGroup);

      // ÉCLAIRAGE
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 1.2);
      dirLight1.position.set(20, 20, 20);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x818cf8, 0.8);
      dirLight2.position.set(-20, -10, -20);
      scene.add(dirLight2);

      // DÉCOR ESPACE
      createSpaceBackground();

      // SPHÈRE DU GLOBE
      const coreGeo = new THREE.SphereGeometry(sphereRadius - 0.05, 64, 64);
      const coreMat = new THREE.MeshStandardMaterial({
        color: 0x0b1a2e,
        roughness: 0.7,
        metalness: 0.5,
      });
      coreMesh = new THREE.Mesh(coreGeo, coreMat);
      globeGroup.add(coreMesh);

      // GRILLE
      const gridGeo = new THREE.SphereGeometry(sphereRadius, 36, 18);
      const gridMat = new THREE.MeshBasicMaterial({
        color: 0x1e293b,
        wireframe: true,
        transparent: true,
        opacity: 0.25
      });
      const gridMesh = new THREE.Mesh(gridGeo, gridMat);
      globeGroup.add(gridMesh);

      // ATMOSPHÈRE
      const atmosGeo = new THREE.SphereGeometry(sphereRadius + 0.4, 64, 64);
      const atmosMat = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
            gl_FragColor = vec4(0.2, 0.5, 1.0, 1.0) * intensity * 0.4;
          }
        `,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        transparent: true
      });
      scene.add(new THREE.Mesh(atmosGeo, atmosMat));

      // CHARGEMENT DU FICHIER JSON
      fetch('moi.json')
        .then(res => res.json())
        .then(data => {
          globalData = data;
          buildGlobe(data);
          buildUI(data);
        });

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onCanvasClick);
      window.addEventListener('mousemove', onMouseMove);
      setTimeout(() => document.getElementById('app-header').classList.add('hide'), 8000);
      window.addEventListener('keydown', e => { if (e.key === 'Escape') closeInfo(); });

      animate();
    }

    function createSpaceBackground() {
      const starsGeo = new THREE.BufferGeometry();
      const starsCount = 2000;
      const starPositions = new Float32Array(starsCount * 3);

      for (let i = 0; i < starsCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 300;
        starPositions[i + 1] = (Math.random() - 0.5) * 300;
        starPositions[i + 2] = (Math.random() - 0.5) * 300;
      }

      starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starsMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.6,
        transparent: true,
        opacity: 0.8
      });
      const starField = new THREE.Points(starsGeo, starsMat);
      scene.add(starField);

      const sunGeo = new THREE.SphereGeometry(8, 32, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const sunMesh = new THREE.Mesh(sunGeo, sunMat);
      sunMesh.position.set(-50, 30, -70);
      scene.add(sunMesh);

      const marsGeo = new THREE.SphereGeometry(2.2, 32, 32);
      const marsMat = new THREE.MeshStandardMaterial({ color: 0xc84b31, roughness: 0.8 });
      const marsMesh = new THREE.Mesh(marsGeo, marsMat);
      marsMesh.position.set(40, -18, -45);
      scene.add(marsMesh);

      const saturnGeo = new THREE.SphereGeometry(3.5, 32, 32);
      const saturnMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.6 });
      const saturnMesh = new THREE.Mesh(saturnGeo, saturnMat);
      saturnMesh.position.set(-35, -25, -55);

      const ringGeo = new THREE.RingGeometry(4.5, 7.5, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x818cf8, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
      saturnRingMesh = new THREE.Mesh(ringGeo, ringMat);
      saturnRingMesh.rotation.x = Math.PI / 3;
      saturnMesh.add(saturnRingMesh);

      scene.add(saturnMesh);
    }

    // Facteur de taille des zones (baisse-le si deux pays se chevauchent)
    const FACTEUR_TAILLE = 0.8;

    function hashStr(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    // Crée une zone pleine + un contour, collées à la surface de la sphère
    function makeCountryShape(lat, lng, angRad, seed, color) {
      const center = latLngToVector3(lat, lng, 1).normalize();
      const ref = Math.abs(center.y) > 0.99 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(ref, center).normalize();
      const v = new THREE.Vector3().crossVectors(center, u).normalize();

      const SEG = 64, RINGS = 6;
      const p1 = (seed % 100) / 100 * Math.PI * 2;
      const p2 = ((seed >> 3) % 100) / 100 * Math.PI * 2;
      const edgeR = a => angRad * (1 + 0.18 * Math.sin(3 * a + p1) + 0.10 * Math.sin(5 * a + p2));

      const R = sphereRadius + 0.03;

      function pointAt(a, f, radius) {
        const d = edgeR(a) * f;
        const dir = u.clone().multiplyScalar(Math.cos(a)).add(v.clone().multiplyScalar(Math.sin(a)));
        return center.clone().multiplyScalar(Math.cos(d)).add(dir.multiplyScalar(Math.sin(d))).multiplyScalar(radius);
      }

      // --- Surface pleine ---
      const pos = [center.x * R, center.y * R, center.z * R];
      for (let r = 1; r <= RINGS; r++) {
        for (let s = 0; s < SEG; s++) {
          const p = pointAt((s / SEG) * Math.PI * 2, r / RINGS, R);
          pos.push(p.x, p.y, p.z);
        }
      }
      const idx = [];
      for (let s = 0; s < SEG; s++) idx.push(0, 1 + s, 1 + ((s + 1) % SEG));
      for (let r = 1; r < RINGS; r++) {
        const a0 = 1 + (r - 1) * SEG, b0 = 1 + r * SEG;
        for (let s = 0; s < SEG; s++) {
          const n = (s + 1) % SEG;
          idx.push(a0 + s, b0 + s, b0 + n, a0 + s, b0 + n, a0 + n);
        }
      }
      const fillGeo = new THREE.BufferGeometry();
      fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      fillGeo.setIndex(idx);
      const fill = new THREE.Mesh(fillGeo, new THREE.MeshBasicMaterial({
        color: color, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false
      }));

      // --- Contour ---
      const bpos = [];
      for (let s = 0; s < SEG; s++) {
        const a = (s / SEG) * Math.PI * 2;
        const o = pointAt(a, 1.0, R + 0.005);
        const i = pointAt(a, 0.93, R + 0.005);
        bpos.push(o.x, o.y, o.z, i.x, i.y, i.z);
      }
      const bidx = [];
      for (let s = 0; s < SEG; s++) {
        const n = (s + 1) % SEG;
        bidx.push(s * 2, s * 2 + 1, n * 2, s * 2 + 1, n * 2 + 1, n * 2);
      }
      const borderGeo = new THREE.BufferGeometry();
      borderGeo.setAttribute('position', new THREE.Float32BufferAttribute(bpos, 3));
      borderGeo.setIndex(bidx);
      const border = new THREE.Mesh(borderGeo, new THREE.MeshBasicMaterial({
        color: color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false
      }));

      return { fill, border };
    }

    // ===== ANTI-CHEVAUCHEMENT (zones qui se touchent sans se superposer) =====
    const MARGE_DEG = 0.15;    // espace entre deux zones (en degrés) : 0 = collées
    const DEPLACEMENT_MAX = 8; // distance max (en degrés) dont un pays peut être décalé

    function vector3ToLatLng(v) {
      const n = v.clone().normalize();
      const phi = Math.acos(Math.max(-1, Math.min(1, n.y)));
      const theta = Math.atan2(n.z, -n.x);
      let lng = theta * 180 / Math.PI - 180;
      if (lng < -180) lng += 360;
      return { lat: 90 - phi * 180 / Math.PI, lng: lng };
    }

    function countryBasis(center) {
      const ref = Math.abs(center.y) > 0.99 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(ref, center).normalize();
      const v = new THREE.Vector3().crossVectors(center, u).normalize();
      return { u, v };
    }

    function resoudreChevauchements(data) {
      const deg = Math.PI / 180;
      const marge = MARGE_DEG * deg;
      const maxDepl = DEPLACEMENT_MAX * deg;
      const items = [];

      data.continents.forEach(c => c.countries.forEach(country => {
        const dir = latLngToVector3(country.lat, country.lng, 1).normalize();
        const seed = hashStr(country.name);
        const rad = (country.size || 1.0) * 3.5 * deg * FACTEUR_TAILLE;
        items.push({
          country: country, dir: dir, orig: dir.clone(), rad: rad, base: rad,
          p1: (seed % 100) / 100 * Math.PI * 2,
          p2: ((seed >> 3) % 100) / 100 * Math.PI * 2
        });
      }));

      // Rayon réel de la zone de "a" dans la direction de "b" (forme irrégulière incluse)
      function bordVers(a, b) {
        const d = a.dir.angleTo(b.dir);
        const t = b.dir.clone().sub(a.dir.clone().multiplyScalar(Math.cos(d)));
        if (t.lengthSq() < 1e-12) return a.rad;
        t.normalize();
        const bs = countryBasis(a.dir);
        const ang = Math.atan2(t.dot(bs.v), t.dot(bs.u));
        return a.rad * (1 + 0.18 * Math.sin(3 * ang + a.p1) + 0.10 * Math.sin(5 * ang + a.p2));
      }
      const besoin = (a, b) => bordVers(a, b) + bordVers(b, a) + marge;
      const enConflit = it => items.some(o => o !== it && it.dir.angleTo(o.dir) < besoin(it, o) - 1e-6);

      function limiter(it) {
        if (it.dir.angleTo(it.orig) > maxDepl) {
          const axis = new THREE.Vector3().crossVectors(it.orig, it.dir).normalize();
          it.dir = it.orig.clone().applyAxisAngle(axis, maxDepl);
        }
      }

      // 1) Écarter les pays qui se superposent
      for (let iter = 0; iter < 400; iter++) {
        let bouge = false;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const a = items[i], b = items[j];
            const d = a.dir.angleTo(b.dir);
            const n = besoin(a, b);
            if (d < n) {
              bouge = true;
              const push = (n - d) / 2 + 1e-4;
              let t = a.dir.clone().sub(b.dir.clone().multiplyScalar(Math.cos(d)));
              if (t.lengthSq() < 1e-10) {
                t = new THREE.Vector3().crossVectors(a.dir, new THREE.Vector3(0, 1, 0));
                if (t.lengthSq() < 1e-10) t.set(1, 0, 0);
              }
              t.normalize();
              a.dir.add(t.clone().multiplyScalar(push)).normalize();
              b.dir.sub(t.clone().multiplyScalar(push)).normalize();
              limiter(a);
              limiter(b);
            }
          }
        }
        if (!bouge) break;
      }

      // 2) Réduire les zones qui se superposent encore (déplacement limité)
      for (let pass = 0; pass < 60; pass++) {
        let reduit = false;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const a = items[i], b = items[j];
            const d = a.dir.angleTo(b.dir);
            const n = besoin(a, b);
            if (n > d + 1e-6) {
              const s = Math.max(0.2, (d - marge) / (n - marge));
              a.rad *= s;
              b.rad *= s;
              reduit = true;
            }
          }
        }
        if (!reduit) break;
      }

      // 3) Rapprocher chaque pays de sa vraie position tant qu'il ne chevauche personne
      for (let k = 0; k < 300; k++) {
        let bouge = false;
        items.forEach(it => {
          const ang = it.dir.angleTo(it.orig);
          if (ang < 1e-4) return;
          const axis = new THREE.Vector3().crossVectors(it.dir, it.orig).normalize();
          const ancien = it.dir.clone();
          it.dir = it.dir.clone().applyAxisAngle(axis, Math.min(ang, 0.2 * deg));
          if (enConflit(it)) it.dir = ancien; else bouge = true;
        });
        if (!bouge) break;
      }

      // 4) Agrandir les zones réduites tant qu'elles ne touchent pas leurs voisines
      for (let k = 0; k < 150; k++) {
        let bouge = false;
        items.forEach(it => {
          if (it.rad >= it.base) return;
          const ancien = it.rad;
          it.rad = Math.min(it.base, it.rad * 1.02);
          if (enConflit(it)) it.rad = ancien; else bouge = true;
        });
        if (!bouge) break;
      }

      // 5) Enregistrer positions et tailles finales
      items.forEach(it => {
        const ll = vector3ToLatLng(it.dir);
        it.country.lat = ll.lat;
        it.country.lng = ll.lng;
        it.country._angRad = it.rad;
      });
    }

    function buildGlobe(data) {
      resoudreChevauchements(data);

      data.continents.forEach(continent => {
        const color = new THREE.Color(continent.color);

        continent.countries.forEach(country => {
          const center = latLngToVector3(country.lat, country.lng, sphereRadius);
          const countryRadius = country.size || 1.0;

          // Zone pleine + contour (remplace l'ancien nuage de points)
          const angRad = country._angRad || (countryRadius * 3.5 * (Math.PI / 180) * FACTEUR_TAILLE);
          const shape = makeCountryShape(country.lat, country.lng, angRad, hashStr(country.name), color);
          const countryCloud = shape.fill;      // zone cliquable
          const countryBorder = shape.border;   // contour

          const beamHeight = 0.8 * Math.sqrt(countryRadius);
          const beamGeo = new THREE.CylinderGeometry(0.02, 0.05, beamHeight, 8);
          beamGeo.translate(0, beamHeight / 2, 0);
          beamGeo.rotateX(Math.PI / 2);

          const beamMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.8 });
          const beamMesh = new THREE.Mesh(beamGeo, beamMat);
          beamMesh.position.copy(center);
          beamMesh.lookAt(center.clone().multiplyScalar(2));
          beamMesh.visible = false;

          const ringGeo = new THREE.RingGeometry(0.08, 0.14, 16);
          const ringMat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.position.copy(center.clone().multiplyScalar(1.01));
          ringMesh.lookAt(center.clone().multiplyScalar(2));
          ringMesh.visible = false;
          pulsingRings.push(ringMesh);

          // Paires de données orientées PROJET
          const countryInfo = {
            type: 'project',
            id: country.id,
            libelles: continent.libelles || {},
            icon: continent.icon,
            continentId: continent.id,
            name: country.name,
            details: country.details,
            technologies: country.technologies || country.stack || [],
            role: country.role || 'Développeur / Concepteur',
            category: country.category || continent.name,
            continentName: continent.name,
            lat: country.lat,
            lng: country.lng,
            color: continent.color
          };

          countryCloud.userData = countryInfo;
          placeInfos[country.id] = countryInfo;
          beamMesh.userData = countryInfo;
          ringMesh.userData = countryInfo;

          globeGroup.add(countryCloud);
          globeGroup.add(countryBorder);
          globeGroup.add(beamMesh);
          globeGroup.add(ringMesh);

          countryObjects.push(countryCloud);
          countryMarkers.push(beamMesh);
        });
      });
    }

    function hexToRgba(hex, alpha) {
      const c = new THREE.Color(hex);
      return `rgba(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}, ${alpha})`;
    }

    function buildUI(data) {
      const navBar = document.getElementById('nav-bar');
      navBar.innerHTML = '';
      const ov = document.createElement('button');
      ov.className = 'nav-btn';
      ov.innerHTML = icon('globe', 20) + '<span>Ensemble</span>';
      ov.title = "Vue d'ensemble";
      ov.setAttribute('aria-label', "Vue d'ensemble");
      ov.addEventListener('click', e => { e.stopPropagation(); vueEnsemble(); });
      navBar.appendChild(ov);

      data.continents.forEach(continent => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.id = `btn-${continent.id}`;
        btn.innerHTML = icon(continent.icon, 20) + '<span>' + (continent.court || continent.name) + '</span>';

        const baseColor = continent.color || '#ffffff';
        const activeBg = hexToRgba(baseColor, 0.25);
        const activeBorder = hexToRgba(baseColor, 0.8);
        const glowColor = hexToRgba(baseColor, 0.4);

        btn.addEventListener('mouseenter', () => {
          if (!btn.classList.contains('active')) {
            btn.style.color = '#ffffff';
            btn.style.backgroundColor = hexToRgba(baseColor, 0.15);
          }
        });

        btn.addEventListener('mouseleave', () => {
          if (!btn.classList.contains('active')) {
            btn.style.color = '#94a3b8';
            btn.style.backgroundColor = 'transparent';
          }
        });

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectContinent(continent);
        });

        btn.setActiveStyle = (isActive) => {
          if (isActive) {
            btn.classList.add('active');
            btn.style.color = '#ffffff';
            btn.style.backgroundColor = activeBg;
            btn.style.borderColor = activeBorder;
            btn.style.boxShadow = `0 0 16px ${glowColor}`;
          } else {
            btn.classList.remove('active');
            btn.style.color = '#94a3b8';
            btn.style.backgroundColor = 'transparent';
            btn.style.borderColor = 'transparent';
            btn.style.boxShadow = 'none';
          }
        };

        navBar.appendChild(btn);
      });
    }

    function updateActiveButton(activeContinentId) {
      if (!globalData) return;
      globalData.continents.forEach(c => {
        const btn = document.getElementById(`btn-${c.id}`);
        if (btn && btn.setActiveStyle) {
          btn.setActiveStyle(c.id === activeContinentId);
        }
      });
    }

    function selectContinent(continent) {
      stopperAutoRotation();
      updateActiveButton(continent.id);

      countryMarkers.forEach(marker => {
        marker.visible = (marker.userData.continentId === continent.id);
      });

      pulsingRings.forEach(ring => {
        ring.visible = (ring.userData.continentId === continent.id);
      });

      if (continent.countries && continent.countries.length > 0) {
        const centerDir = new THREE.Vector3(0, 0, 0);
        continent.countries.forEach(c => {
          centerDir.add(latLngToVector3(c.lat, c.lng, 1));
        });
        centerDir.normalize();

        let maxAngle = 0;
        continent.countries.forEach(c => {
          const p = latLngToVector3(c.lat, c.lng, 1);
          const angle = centerDir.angleTo(p);
          if (angle > maxAngle) maxAngle = angle;
        });

        const fovRad = (camera.fov * Math.PI) / 180;
        const calculatedDist = (sphereRadius * Math.sin(maxAngle) / Math.sin(fovRad / 2)) + 3.0;
        const fitDistance = Math.max(8.5, calculatedDist);

        zoomToDirection(centerDir, fitDistance);
        
        showStructuredInfo({
          tag: 'Territoire',
          icon: continent.icon,
          title: continent.name,
          color: continent.color,
          details: continent.detail || '',
          libelles: Object.assign({}, continent.libelles, { resume: 'Bienvenue' }),
          extraMetrics: [
            { label: 'Lieux à explorer', value: continent.countries.length },
            { label: 'Thème', value: continent.domain || '' }
          ],
          places: continent.countries.map(c => ({ id: c.id, name: c.name }))
        });
      }
    }

    function zoomToDirection(targetDir, targetDistance) {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      const targetPos = targetDir.clone().multiplyScalar(sphereRadius + targetDistance);
      const startPos = camera.position.clone();

      const startDist = startPos.length();
      const endDist = targetPos.length();

      const startDir = startPos.clone().normalize();
      const angle = startDir.angleTo(targetDir);

      const axis = new THREE.Vector3().crossVectors(startDir, targetDir);
      if (axis.lengthSq() > 0) {
        axis.normalize();
      } else {
        axis.set(0, 1, 0);
      }

      let progress = 0;

      function animateStep() {
        progress += 0.035;
        const ease = 0.5 - Math.cos(Math.min(progress, 1) * Math.PI) / 2;

        const currentDir = startDir.clone().applyAxisAngle(axis, angle * ease);
        const currentDist = THREE.MathUtils.lerp(startDist, endDist, ease);

        camera.position.copy(currentDir.multiplyScalar(currentDist));
        controls.target.set(0, 0, 0);
        controls.update();

        if (progress < 1) {
          animFrameId = requestAnimationFrame(animateStep);
        }
      }
      animateStep();
    }

    function zoomToLocation(lat, lng, targetDistance) {
      const dir = latLngToVector3(lat, lng, 1);
      zoomToDirection(dir, targetDistance);
    }

    const placeInfos = {};
    const LIB = { role: 'Rôle', tech: 'Technologies', resume: 'En quelques mots', liste: 'Réalisations' };

    const ICONS = {
      globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20z"/>',
      compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"/>',
      tools: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
      layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
      mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
      code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
      briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
    };
    function icon(name, size) {
      const px = size || 16;
      return `<svg class="ico" viewBox="0 0 24 24" width="${px}" height="${px}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.globe}</svg>`;
    }

    function showMarkersFor(continentId) {
      countryMarkers.forEach(m => { m.visible = (m.userData.continentId === continentId); });
      pulsingRings.forEach(r => { r.visible = (r.userData.continentId === continentId); });
    }

    function focusPlace(d) {
      stopperAutoRotation();
      showMarkersFor(d.continentId);
      updateActiveButton(d.continentId);
      zoomToLocation(d.lat, d.lng, ZOOM_PAYS);
      showStructuredInfo({
        tag: d.continentName, icon: d.icon, title: d.name, color: d.color, details: d.details,
        technologies: d.technologies, role: d.role, libelles: d.libelles, backTo: d.continentId
      });
    }
    function focusPlaceById(id) { if (placeInfos[id]) focusPlace(placeInfos[id]); }
    function selectContinentById(id) {
      const c = globalData.continents.find(x => x.id === id);
      if (c) selectContinent(c);
    }
    function vueEnsemble() {
      closeInfo();
      showMarkersFor(null);
      updateActiveButton(null);
      zoomToDirection(camera.position.clone().normalize(), 11);
      reactiverAutoRotation();
    }

    function pick(event) {
      const mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
      const rc = new THREE.Raycaster();
      rc.setFromCamera(mouse, camera);
      const hits = rc.intersectObjects([...countryMarkers.filter(m => m.visible), ...countryObjects, coreMesh]);
      return hits.length ? hits[0].object : null;
    }

    function onCanvasClick(event) {
      if (event.target.closest('#nav-bar') || event.target.closest('#info-panel') || event.target.closest('#app-header')) return;
      const hit = pick(event);
      if (hit && hit.userData && hit.userData.type === 'project') focusPlace(hit.userData);
      else reactiverAutoRotation();
    }

    function onMouseMove(event) {
      const tip = document.getElementById('tooltip');
      if (!coreMesh || event.target.closest('#nav-bar') || event.target.closest('#info-panel')) { tip.style.display = 'none'; return; }
      const hit = pick(event);
      if (hit && hit.userData && hit.userData.type === 'project') {
        tip.textContent = hit.userData.name;
        tip.style.left = (event.clientX + 14) + 'px';
        tip.style.top = (event.clientY + 14) + 'px';
        tip.style.display = 'block';
        document.body.style.cursor = 'pointer';
      } else {
        tip.style.display = 'none';
        document.body.style.cursor = '';
      }
    }

    function lier(t) {
      return t.replace(/([\w.+-]+@[\w-]+\.[\w.]*\w)/g, '<a href="mailto:$1">$1</a>')
              .replace(/(0\d{2}(?: \d{2,3}){3})/g, m => `<a href="tel:${m.replace(/ /g, '')}">${m}</a>`);
    }

    function showStructuredInfo(d) {
      const lib = Object.assign({}, LIB, d.libelles || {});
      const panel = document.getElementById('info-panel');
      const tagEl = document.getElementById('info-tag');
      panel.style.setProperty('--accent', d.color || '#f4e3c1');

      tagEl.innerHTML = (d.icon ? icon(d.icon, 14) : '') + '<span>' + (d.tag || '') + '</span>';
      if (d.color) {
        tagEl.style.backgroundColor = hexToRgba(d.color, 0.15);
        tagEl.style.borderColor = hexToRgba(d.color, 0.4);
        tagEl.style.color = d.color;
      }
      document.getElementById('info-title').innerText = d.title;

      const cards = [];
      if (d.role) cards.push([lib.role, d.role]);
      (d.extraMetrics || []).forEach(m => cards.push([m.label, m.value]));

      let h = '';
      if (cards.length) {
        h += `<div class="metrics-grid">${cards.map(c => `<div class="metric-card"><div class="metric-label">${c[0]}</div><div class="metric-value">${c[1]}</div></div>`).join('')}</div>`;
      }

      const lines = (d.details || '').split('\n').map(l => l.trim()).filter(Boolean);
      const items = lines.filter(l => /^[-•*]/.test(l)).map(l => l.replace(/^[-•*]\s*/, ''));
      const para = lines.filter(l => !/^[-•*]/.test(l)).join(' ');

      if (para) h += `<div class="info-section"><div class="info-section-title">${lib.resume}</div><p class="info-text-paragraph">${para}</p></div>`;
      if (items.length) {
        h += `<div class="info-section"><div class="info-section-title">${lib.liste}</div><ul class="info-list">${items.map(i => `<li class="info-list-item"><span style="color:var(--accent)">•</span><span>${lier(i)}</span></li>`).join('')}</ul></div>`;
      }
      if (d.technologies && d.technologies.length) {
        h += `<div class="info-section"><div class="info-section-title">${lib.tech}</div><div class="tech-tags-container">${d.technologies.map(t => `<span class="tech-badge">${t}</span>`).join('')}</div></div>`;
      }
      if (d.places && d.places.length) {
        h += `<div class="info-section"><div class="info-section-title">Les lieux à explorer</div>${d.places.map(p => `<button class="place-chip" onclick="focusPlaceById('${p.id}')">${p.name}</button>`).join('')}</div>`;
      }
      if (d.backTo) h += `<button class="back-link" onclick="selectContinentById('${d.backTo}')">← Retour à « ${d.tag} »</button>`;

      document.getElementById('info-body').innerHTML = h;
      panel.style.display = 'block';
    }

    function closeInfo() {
      document.getElementById('info-panel').style.display = 'none';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = Date.now() * 0.003;

      pulsingRings.forEach(ring => {
        if (ring.visible) {
          const scale = 1 + Math.sin(time * 2) * 0.2;
          ring.scale.set(scale, scale, scale);
        }
      });

      if (saturnRingMesh) {
        saturnRingMesh.rotation.z += 0.002;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
